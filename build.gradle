plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'cc.xypp.modernhud'
version = '1.3.0-forge1201'
base.archivesName = 'modernhud'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'; compileOnly fileTree(dir:'libs',include:['*.jar']) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs += ['-Xmaxerrs','1000'] }
jar { finalizedBy 'reobfJar' }
tasks.register('writeCompileClasspath') { doLast { file('build/compile-classpath.txt').text=sourceSets.main.compileClasspath.asPath } }
