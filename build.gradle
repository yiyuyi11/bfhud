plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'cc.xypp'
version = '1.3.0'
base { archivesName = 'modernhud-full' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.233'
    runs {
        client { client() }
    }
}

dependencies {
    // Optional integrations: TaCZ is compiled against when its jar is dropped into libs/
    // (the CI workflow downloads it, it is never redistributed here).
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'modernhud',
            'Implementation-Title': 'ModernHUD',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'yiyuyi11'
        )
    }
}
