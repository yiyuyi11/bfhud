name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch TaCZ (compile-only integration)
        run: |
          mkdir -p libs
          url=$(curl -s "https://api.modrinth.com/v2/project/tacz-1.21.1/version" \
            -H "User-Agent: bfhud-ci/1.0" \
            | jq -r '[.[] | select(.loaders | index("neoforge"))][0].files[] | select(.primary) | .url')
          echo "TaCZ: $url"
          curl -sL "$url" -o libs/tacz.jar
          ls -la libs

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modernhud
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      - name: Publish the failure log as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'the build step failed; no log file was produced';
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              body = '```\n' + log.slice(-12000) + '\n```';
            } catch (e) {}
            const title = 'CI failure log';
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }