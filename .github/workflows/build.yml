name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch TaCZ (compile-only integration)
        run: |
          mkdir -p libs
          url=$(curl -s "https://api.modrinth.com/v2/project/tacz-1.21.1/version" \
            -H "User-Agent: bfhud-ci/1.0" \
            | jq -r '[.[] | select(.loaders | index("neoforge"))][0].files[] | select(.primary) | .url')
          echo "TaCZ: $url"
          curl -sL "$url" -o libs/tacz.jar
          ls -la libs

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: modernhud
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true