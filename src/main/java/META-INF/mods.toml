[[mods]]
modId = "modernhud"
version = "1.2.6"
displayName = "Modern HUD"
authors = "Lanixius"
# Works with the mod on the client only. Shield feedback for other entities and the
# hit / kill sounds need the mod on the server as well.
displayTest = "IGNORE_ALL_VERSION"
description = '''
A HUD for Forge 1.20.1 with a military-shooter look. It adds no items, blocks or ores.

Player and team health with absorption bars, a weapon widget for TACZ (ammo, fire mode,
secondary weapon, gear slots), a compass, killstreak and boss bars, hit direction arcs,
and hit, kill and shield sounds. Optional support for TACZ, ModernLoadout, Modern Ping
and SuperbWarfare.

Settings: Mods > Modern HUD > Config. Changes show on the HUD while you edit them.
'''

